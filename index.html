<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media Gallery</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:28px 16px}h1{margin:0 0 8px}.sub{color:#999}
.gallery{max-width:1200px;margin:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.item{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:10px;background:#222;cursor:pointer}
.item img,.item video{width:100%;height:100%;object-fit:cover;display:block}
.name{position:absolute;left:0;right:0;bottom:0;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:10px;right:10px;background:#000b;padding:5px 8px;border-radius:6px;font-size:12px}
.empty{text-align:center;color:#888;padding:60px 20px}
.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:20px;background:#000f}
.modal.open{display:flex}.modal img,.modal video{max-width:95vw;max-height:90vh}.close{position:fixed;top:15px;right:18px;width:42px;height:42px;border:0;border-radius:50%;background:#ffffff22;color:#fff;font-size:28px;cursor:pointer}
</style>
</head>
<body>
<header><h1>Media Gallery</h1><div id="count" class="sub"></div></header>
<main id="gallery" class="gallery"></main>
<div id="empty" class="empty" style="display:none">Chưa có media.</div>
<div id="modal" class="modal"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div>

<script>
const R2_BASE_URL="https://pub-d486894ad6c04e98a81790bb0093f586.r2.dev";
const MEDIA_JSON="media.json";

const gallery=document.getElementById("gallery"), empty=document.getElementById("empty");
const count=document.getElementById("count"), modal=document.getElementById("modal");
const modalContent=document.getElementById("modalContent");

function mediaUrl(path){
  return R2_BASE_URL.replace(/\/$/,"")+"/"+path.split("/").map(encodeURIComponent).join("/");
}
function getType(item){
  if(item.type)return item.type.toLowerCase();
  const e=item.path.split(".").pop().toLowerCase();
  if(["jpg","jpeg","png","gif","webp","avif"].includes(e))return"image";
  if(["mp4","webm","ogg","mov"].includes(e))return"video";
}
async function loadMedia(){
  try{
    const r=await fetch(MEDIA_JSON+"?v="+Date.now());
    if(!r.ok)throw Error();
    const media=await r.json();
    if(!Array.isArray(media)||!media.length){empty.style.display="block";return}
    count.textContent=media.length+" media";
    render(media);
  }catch(e){
    empty.textContent="Không thể tải media.json.";
    empty.style.display="block";
  }
}
function render(media){
  media.forEach(item=>{
    const type=getType(item);if(!type)return;
    const url=mediaUrl(item.path), el=document.createElement("div");
    el.className="item";
    if(type==="image"){
      const img=document.createElement("img");img.src=url;img.alt=item.name||item.path;img.loading="lazy";
      el.appendChild(img);el.onclick=()=>openImage(url,item.name||"");
    }else{
      const v=document.createElement("video");v.src=url;v.muted=true;v.preload="metadata";v.playsInline=true;
      const b=document.createElement("div");b.className="badge";b.textContent="▶ VIDEO";
      el.append(v,b);el.onclick=()=>openVideo(url);
    }
    if(item.name){const n=document.createElement("div");n.className="name";n.textContent=item.name;el.appendChild(n)}
    gallery.appendChild(el);
  });
}
function openImage(url,name){
  modalContent.innerHTML="";const img=document.createElement("img");img.src=url;img.alt=name;modalContent.appendChild(img);modal.classList.add("open");
}
function openVideo(url){
  modalContent.innerHTML="";const v=document.createElement("video");v.src=url;v.controls=true;v.autoplay=true;v.playsInline=true;modalContent.appendChild(v);modal.classList.add("open");
}
function closeModal(){modal.classList.remove("open");modalContent.innerHTML=""}
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
loadMedia();
</script>
</body>
</html>
